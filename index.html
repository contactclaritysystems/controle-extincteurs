<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarity Systems</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

:root {
  --accent:#0A84FF;
  --danger:#FF3B30;
  --warning:#FF9500;
  --success:#30D158;
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --label:#000000;
  --label2:rgba(60,60,67,0.75);
  --label3:rgba(60,60,67,0.55);
  --sep:rgba(60,60,67,0.12);
}

html, body {
  height:100%;
  background:var(--bg);
  font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

#wrap { display:flex; justify-content:center; min-height:100vh; }

#app {
  width:100%;
  max-width:430px;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.hdr {
  background:#fff;
  padding:16px 18px 10px;
  border-bottom:1px solid var(--sep);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo { height:80px; max-width:180px; object-fit:contain; }

.badge {
  background:rgba(255,59,48,0.12);
  color:var(--danger);
  font-size:12px;
  font-weight:700;
  padding:4px 10px;
  border-radius:20px;
  display:none;
}

.badge.on { display:block; }

.tabs {
  display:flex;
  background:#fff;
  border-bottom:1px solid var(--sep);
}

.tab {
  flex:1;
  padding:13px 4px;
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:var(--label3);
  cursor:pointer;
  position:relative;
}

.tab.active { color:var(--accent); }

.tab.active::after {
  content:'';
  position:absolute;
  left:16px;
  right:16px;
  bottom:-1px;
  height:2.5px;
  background:var(--accent);
  border-radius:3px;
}

#content {
  flex:1;
  overflow-y:auto;
  padding:14px;
  background:var(--bg);
}

.slabel {
  font-size:11px;
  font-weight:800;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--label3);
  padding:4px 2px 10px;
}

.card {
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.07);
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.card::before {
  content:'';
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
}

.card.red::before { background:var(--danger); }
.card.orange::before { background:var(--warning); }
.card.ok::before { background:var(--success); }

.icon {
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  flex-shrink:0;
  background:rgba(10,132,255,0.10);
}

.card.red .icon { background:rgba(255,59,48,0.10); }
.card.orange .icon { background:rgba(255,149,0,0.10); }
.card.ok .icon { background:rgba(48,209,88,0.10); }

.info { flex:1; min-width:0; }

.cname {
  font-size:16px;
  font-weight:800;
  color:var(--label);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:4px;
}

.cdate {
  font-size:13px;
  color:var(--label3);
  line-height:1.35;
}

.chev {
  font-size:26px;
  color:var(--label3);
}

.detail-top {
  background:#fff;
  margin:-14px -14px 18px;
  padding:16px 18px 18px;
  border-bottom:1px solid var(--sep);
}

.back {
  color:var(--accent);
  font-size:15px;
  font-weight:800;
  margin-bottom:14px;
  cursor:pointer;
}

.detail-title {
  font-size:26px;
  font-weight:800;
  color:var(--label);
}

.detail-sub {
  font-size:13px;
  color:var(--label3);
  font-weight:700;
  margin-top:2px;
}

.main-intervention {
  background:#fff;
  border-radius:18px;
  padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.07);
  display:flex;
  gap:12px;
  margin-bottom:14px;
}

.main-title {
  font-size:18px;
  font-weight:800;
  margin-bottom:6px;
}

.main-line {
  font-size:14px;
  color:var(--label2);
  line-height:1.45;
}

.main-date {
  color:var(--warning);
  font-weight:800;
  margin-top:8px;
}

.action-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.action {
  background:#fff;
  border:none;
  border-radius:16px;
  min-height:96px;
  padding:12px 6px;
  font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
}

.action-ico { font-size:30px; }

.action span {
  font-size:13px;
  font-weight:800;
}

.action.disabled {
  opacity:.45;
}

.bottom-actions {
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-bottom:18px;
}

.primary-btn,
.secondary-btn,
.danger-btn {
  width:100%;
  border:none;
  border-radius:16px;
  font-family:inherit;
  font-size:16px;
  font-weight:800;
  padding:16px;
  cursor:pointer;
}

.primary-btn {
  background:var(--accent);
  color:#fff;
}

.secondary-btn {
  background:#fff;
  color:var(--accent);
  border:1px solid rgba(10,132,255,0.18);
}

.danger-btn {
  background:#fff;
  color:var(--danger);
  border:1px solid rgba(255,59,48,0.18);
}

.empty {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding:72px 32px;
}

.empty-ico { font-size:46px; }
.empty-title { font-size:17px; font-weight:800; }
.empty-sub { font-size:13px; color:var(--label3); text-align:center; }

.loader { display:flex; justify-content:center; padding:70px; }

.spinner {
  width:28px;
  height:28px;
  border:3px solid var(--sep);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

.backdrop {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.backdrop.open {
  opacity:1;
  pointer-events:all;
}

.sheet {
  width:100%;
  max-width:430px;
  padding:0 10px 28px;
}

.sheet-card {
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:8px;
}

.sheet-info {
  padding:16px;
  text-align:center;
  border-bottom:1px solid var(--sep);
}

.sheet-name { font-size:16px; font-weight:800; }
.sheet-sub { font-size:13px; color:var(--label3); margin-top:3px; }

.sbtn {
  width:100%;
  padding:16px;
  background:#fff;
  border:none;
  font-family:inherit;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.sbtn + .sbtn { border-top:1px solid var(--sep); }
.sbtn.confirm { color:var(--accent); }
.sbtn.warn { color:var(--warning); }
.sbtn.danger { color:var(--danger); }

.toast {
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%) translateY(10px);
  background:rgba(28,28,28,0.88);
  color:#fff;
  padding:11px 18px;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  z-index:999;
  opacity:0;
  transition:.2s;
}

.toast.show {
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

textarea {
  width:100%;
  min-height:130px;
  border:none;
  border-radius:16px;
  padding:14px;
  font-family:inherit;
  font-size:15px;
  resize:none;
  outline:none;
  box-shadow:0 2px 8px rgba(0,0,0,0.07);
}

@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

<body>

<div id="wrap">
  <div id="app">

    <div class="hdr" id="mainHeader">
      <img src="https://i.imgur.com/1ZFTLIo.png" class="logo" alt="Clarity Systems">
      <span class="badge" id="badge"></span>
    </div>

    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="today">Aujourd'hui</div>
      <div class="tab" data-tab="planning">Planning</div>
      <div class="tab" data-tab="history">Historique</div>
    </div>

    <div id="content"></div>

  </div>
</div>

<div class="backdrop" id="backdrop">
  <div class="sheet">
    <div class="sheet-card">
      <div class="sheet-info">
        <div class="sheet-name" id="sname"></div>
        <div class="sheet-sub" id="ssub"></div>
      </div>
      <div id="sheetButtons"></div>
    </div>
    <div class="sheet-card">
      <button class="sbtn" onclick="closeSheet()">Retour</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GET_URL  = "https://hook.eu1.make.com/wfp9dc520ic15yvl7u4lx6v1oyuhlckn";
const POST_URL = "https://hook.eu1.make.com/v2at1keat2dqxxf2jza4tnxp3m3a2g35";
const HIST_URL = "https://hook.eu1.make.com/6etkl3pphxxwmly0jha93m246am0d2n8";

let items = [];
let hist = [];
let currentTab = "today";
let selectedItem = null;
let pendingId = null;

let reportLinesById = {};
let reportClosedById = {};
let tempLine = {};
let reportStep = 1;

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    currentTab = t.dataset.tab;
    selectedItem = null;

    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");

    showMainBars();
    render();
  });
});

document.getElementById("backdrop").addEventListener("click", e => {
  if (e.target.id === "backdrop") closeSheet();
});

async function loadData() {
  showLoader();

  try { items = await (await fetch(GET_URL)).json(); } 
  catch { items = []; }

  try { hist = await (await fetch(HIST_URL)).json(); } 
  catch { hist = []; }

  updateBadge();
  render();
}

function render() {
  const c = document.getElementById("content");
  c.innerHTML = "";

  if (selectedItem) {
    renderDetail(selectedItem);
    return;
  }

  showMainBars();

  const today = midnight(new Date());

  if (currentTab === "today") {
    const all = items.filter(i => midnight(i.date) <= today);

    if (!all.length) {
      c.innerHTML = empty("✅", "Aucune intervention aujourd'hui", "Le planning est à jour.");
      return;
    }

    const late = all.filter(i => midnight(i.date) < today);
    const todayL = all.filter(i => midnight(i.date).getTime() === today.getTime());

    if (late.length) {
      c.innerHTML += `<div class="slabel">En retard</div>`;
      late.forEach((item, i) => c.innerHTML += listCard(item, i, "red"));
    }

    if (todayL.length) {
      c.innerHTML += `<div class="slabel">Aujourd’hui</div>`;
      todayL.forEach((item, i) => c.innerHTML += listCard(item, i, "orange"));
    }

  } else if (currentTab === "planning") {
    const sorted = [...items].sort((a,b) => new Date(a.date)-new Date(b.date));

    if (!sorted.length) {
      c.innerHTML = empty("📅", "Planning vide", "Aucune intervention planifiée.");
      return;
    }

    c.innerHTML += `<div class="slabel">Planning complet</div>`;

    sorted.forEach((item, i) => {
      const d = midnight(item.date);
      const cls = d < today ? "red" : d.getTime() === today.getTime() ? "orange" : "ok";
      c.innerHTML += listCard(item, i, cls);
    });

  } else {
    const sorted = [...hist].sort((a,b) => new Date(b.date)-new Date(a.date));

    if (!sorted.length) {
      c.innerHTML = empty("🗂️", "Aucun historique", "Les interventions terminées apparaîtront ici.");
      return;
    }

    c.innerHTML += `<div class="slabel">Terminées</div>`;

    sorted.forEach(item => {
      c.innerHTML += `
        <div class="card ok">
          <div class="icon">✅</div>
          <div class="info">
            <div class="cname">${safe([item.entreprise, item.name].filter(Boolean).join(" · "))}</div>
            <div class="cdate">${fmtDate(item.date)} · ${fmtHeure(item.date)}</div>
            <div class="cdate">${safe(getAdresseSansCP(item.adresse))}</div>
            <div class="cdate">${safe(getCodePostalVille(item.adresse))}</div>
          </div>
        </div>`;
    });
  }
}

function listCard(item, idx, cls) {
  const ico = cls === "red" ? "⚠️" : cls === "orange" ? "📅" : "📋";

  return `
    <div class="card ${cls}" onclick="openDetail('${escapeJs(item.id)}')">
      <div class="icon">${ico}</div>
      <div class="info">
        <div class="cname">${safe(item.entreprise || "")} · ${safe(item.name || "")}</div>
        <div class="cdate">${fmtDate(item.date)} · ${fmtHeure(item.date)}</div>
        <div class="cdate">${safe(getAdresseSansCP(item.adresse))}</div>
        <div class="cdate">${safe(getCodePostalVille(item.adresse))}</div>
      </div>
      <div class="chev">›</div>
    </div>`;
}

function openDetail(id) {
  selectedItem = items.find(i => String(i.id) === String(id));
  if (selectedItem) render();
}

function renderDetail(item) {
  hideMainBars();

  const c = document.getElementById("content");
  const today = midnight(new Date());
  const d = midnight(item.date);

  const isPlanning = currentTab === "planning";
  const isFuture = d > today;

  const showWorkActions = !isPlanning && !isFuture;

  const phone = item.telephone || item.tel || item.phone || "";
  const hasPhone = String(phone).trim().length > 0;

  const lines = reportLinesById[item.id] || [];
  const reportDone = reportClosedById[item.id] === true;

  const reportStatus = showWorkActions ? `
    <div class="main-line">
      ${reportDone ? "✅ Rapport clôturé" : lines.length ? "📝 Rapport en cours" : "Rapport non rempli"}
    </div>
  ` : "";

  const closeButton = showWorkActions ? `
    <button class="primary-btn" onclick="tryCloseIntervention('${escapeJs(item.id)}')">
      Clôturer l’intervention
    </button>
  ` : "";

  const workButtons = showWorkActions ? `
    <button class="action" onclick="openReportPage()">
      <div class="action-ico">📋</div><span>Rapport</span>
    </button>

    <button class="action" onclick="toast('Facture bientôt disponible')">
      <div class="action-ico">💶</div><span>Facture</span>
    </button>
  ` : "";

  c.innerHTML = `
    <div class="detail-top">
      <div class="back" onclick="backToList()">‹ Retour</div>
      <div class="detail-title">Intervention</div>
      <div class="detail-sub">${isPlanning ? "Planning" : "Fiche du jour"}</div>
    </div>

    <div class="main-intervention">
      <div class="icon">📅</div>
      <div class="info">
        <div class="main-title">${safe(item.entreprise || item.name || "Client")}</div>
        <div class="main-line">${safe(item.name || "")}</div>
        <div class="main-line">${safe(getAdresseSansCP(item.adresse))}</div>
        <div class="main-line">${safe(getCodePostalVille(item.adresse))}</div>
        <div class="main-line main-date">${fmtDate(item.date)} · ${fmtHeure(item.date)}</div>
        ${reportStatus}
      </div>
    </div>

    <div class="action-grid">
      <button class="action ${hasPhone ? "" : "disabled"}" onclick="${hasPhone ? `callClient('${escapeJs(phone)}')` : `toast('Téléphone non renseigné')`}">
        <div class="action-ico">📞</div><span>Appeler</span>
      </button>

      <button class="action" onclick="openMaps('${escapeJs(item.adresse || "")}')">
        <div class="action-ico">🧭</div><span>Itinéraire</span>
      </button>

      <button class="action" onclick="toast('Infos client bientôt disponibles')">
        <div class="action-ico">👤</div><span>Infos client</span>
      </button>

      <button class="action" onclick="toast('Documents bientôt disponibles')">
        <div class="action-ico">📄</div><span>Documents</span>
      </button>

      ${workButtons}
    </div>

    <div class="bottom-actions">
      ${closeButton}

      <button class="secondary-btn" onclick="openRescheduleSheet('${escapeJs(item.id)}', '${escapeJs(item.name || item.entreprise || "Client")}')">
        Reporter
      </button>

      <button class="danger-btn" onclick="openCancelSheet('${escapeJs(item.id)}', '${escapeJs(item.name || item.entreprise || "Client")}')">
        Annuler
      </button>
    </div>`;
}

function backToList() {
  selectedItem = null;
  showMainBars();
  render();
}

/* RAPPORT V2 */
function openReportPage() {
  if (!selectedItem) return;

  hideMainBars();

  const id = selectedItem.id;
  const lines = reportLinesById[id] || [];
  const reportDone = reportClosedById[id] === true;

  document.getElementById("content").innerHTML = `
    <div class="detail-top">
      <div class="back" onclick="renderDetail(selectedItem)">‹ Retour</div>
      <div class="detail-title">Rapport</div>
      <div class="detail-sub">${safe(selectedItem.entreprise || selectedItem.name || "Client")}</div>
    </div>

    <div class="slabel">Tâches ajoutées</div>

    ${lines.length ? lines.map((l, i) => `
      <div class="card ok">
        <div class="icon">📋</div>
        <div class="info">
          <div class="cname">${safe(l.equipement)} · ${safe(l.action)}</div>
          <div class="cdate">${safe(l.resultat)}</div>
          ${l.commentaire ? `<div class="cdate">${safe(l.commentaire)}</div>` : ""}
        </div>
        ${!reportDone ? `<div class="chev" onclick="removeReportLine(${i}); event.stopPropagation();">×</div>` : ""}
      </div>
    `).join("") : empty("📋", "Aucune tâche", "Ajoutez une première ligne au rapport.")}

    ${!reportDone ? `
      <button class="secondary-btn" onclick="startReportLine()">+ Ajouter une tâche</button>

      <div class="bottom-actions">
        <button class="primary-btn" onclick="closeReport()">Clôturer le rapport</button>
      </div>
    ` : `
      <div class="bottom-actions">
        <button class="primary-btn" onclick="renderDetail(selectedItem)">Retour à l’intervention</button>
      </div>
    `}
  `;
}

function startReportLine() {
  tempLine = {};
  reportStep = 1;
  renderReportStep();
}

function renderReportStep() {
  if (reportStep === 1) {
    renderChoiceStep("Équipement", [
      "Extincteur", "BAES", "Alarme incendie",
      "RIA", "Désenfumage", "Porte coupe-feu",
      "Détecteur", "Signalétique", "Autre"
    ], "equipement");
  }

  if (reportStep === 2) {
    renderChoiceStep("Action réalisée", [
      "Vérification", "Pose", "Remplacement",
      "Maintenance", "Recharge", "Dépose",
      "Mise en service", "Réparation", "Contrôle visuel"
    ], "action");
  }

  if (reportStep === 3) {
    renderChoiceStep("Résultat", [
      "Conforme", "Non conforme", "À remplacer",
      "À réparer", "Accès impossible", "Client absent",
      "Non testé", "À revoir"
    ], "resultat");
  }

  if (reportStep === 4) {
    document.getElementById("content").innerHTML = `
      <div class="detail-top">
        <div class="back" onclick="reportStep=3;renderReportStep()">‹ Retour</div>
        <div class="detail-title">Commentaire</div>
        <div class="detail-sub">Optionnel</div>
      </div>

      <textarea id="comment" placeholder="Exemple : RAS, accès impossible, remplacement conseillé..."></textarea>

      <div class="bottom-actions">
        <button class="primary-btn" onclick="saveReportLine()">Ajouter au rapport</button>
      </div>`;
  }
}

function renderChoiceStep(title, options, key) {
  document.getElementById("content").innerHTML = `
    <div class="detail-top">
      <div class="back" onclick="backReportStep()">‹ Retour</div>
      <div class="detail-title">${title}</div>
    </div>

    <div class="action-grid">
      ${options.map(o => `
        <button class="action" onclick="selectReportValue('${key}', '${escapeJs(o)}')">
          <span>${safe(o)}</span>
        </button>
      `).join("")}
    </div>`;
}

function selectReportValue(key, value) {
  tempLine[key] = value;
  reportStep++;
  renderReportStep();
}

function backReportStep() {
  if (reportStep <= 1) {
    openReportPage();
    return;
  }
  reportStep--;
  renderReportStep();
}

function saveReportLine() {
  const id = selectedItem.id;

  if (!reportLinesById[id]) reportLinesById[id] = [];

  tempLine.commentaire = document.getElementById("comment").value || "";
  reportLinesById[id].push({...tempLine});

  toast("✅ Tâche ajoutée");
  openReportPage();
}

function removeReportLine(index) {
  const id = selectedItem.id;
  if (!reportLinesById[id]) return;

  reportLinesById[id].splice(index, 1);
  openReportPage();
}

function closeReport() {
  const id = selectedItem.id;
  const lines = reportLinesById[id] || [];

  if (!lines.length) {
    toast("Ajoutez au moins une tâche");
    return;
  }

  reportClosedById[id] = true;
  toast("✅ Rapport clôturé");
  renderDetail(selectedItem);
}

/* CLÔTURE / REPORT / ANNULATION */
function tryCloseIntervention(id) {
  if (!reportClosedById[id]) {
    toast("Veuillez clôturer le rapport avant");
    return;
  }

  openCloseSheet(id, selectedItem.name || selectedItem.entreprise || "Client");
}

function openCloseSheet(id, name) {
  pendingId = id;

  openSheet(
    name,
    "Clôturer cette intervention ?",
    `<button class="sbtn confirm" onclick="confirmClose()">✓ Clôturer l’intervention</button>`
  );
}

async function confirmClose() {
  try {
    await fetch(POST_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        id: pendingId,
        rapport: reportLinesById[pendingId] || []
      })
    });
  } catch {}

  closeSheet();
  toast("✅ Intervention clôturée");
  selectedItem = null;

  setTimeout(() => {
    showMainBars();
    loadData();
  }, 420);
}

function openRescheduleSheet(id, name) {
  pendingId = id;

  openSheet(
    name,
    "Envoyer un lien de reprogrammation au client ?",
    `<button class="sbtn confirm" onclick="fakeAction('reporter')">Envoyer le lien de RDV</button>`
  );
}

function openCancelSheet(id, name) {
  pendingId = id;

  openSheet(
    name,
    "Que voulez-vous faire ?",
    `<button class="sbtn warn" onclick="fakeAction('annuler_reprogrammer')">Annuler et reprogrammer</button>
     <button class="sbtn danger" onclick="fakeAction('annuler_definitif')">Annuler définitivement</button>`
  );
}

function fakeAction(action) {
  closeSheet();

  if (action === "reporter") toast("Lien de RDV bientôt connecté à Make");
  if (action === "annuler_reprogrammer") toast("Annulation + reprogrammation bientôt connectées");
  if (action === "annuler_definitif") toast("Annulation définitive bientôt connectée");
}

/* UI */
function openSheet(name, sub, buttonsHtml) {
  document.getElementById("sname").textContent = name;
  document.getElementById("ssub").textContent = sub;
  document.getElementById("sheetButtons").innerHTML = buttonsHtml;
  document.getElementById("backdrop").classList.add("open");
}

function closeSheet() {
  document.getElementById("backdrop").classList.remove("open");
}

function showMainBars() {
  document.getElementById("mainHeader").style.display = "flex";
  document.getElementById("tabs").style.display = "flex";
}

function hideMainBars() {
  document.getElementById("mainHeader").style.display = "none";
  document.getElementById("tabs").style.display = "none";
}

function showLoader() {
  document.getElementById("content").innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
}

function empty(ico, title, sub = "") {
  return `
    <div class="empty">
      <div class="empty-ico">${ico}</div>
      <div class="empty-title">${title}</div>
      <div class="empty-sub">${sub}</div>
    </div>`;
}

let tt;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ACTIONS */
function callClient(phone) {
  window.location.href = "tel:" + phone;
}

function openMaps(adresse) {
  const url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(adresse);
  window.open(url, "_blank");
}

/* UTILS */
function updateBadge() {
  const today = midnight(new Date());
  const n = items.filter(i => midnight(i.date) < today).length;
  const b = document.getElementById("badge");

  b.textContent = n + " en retard";
  b.classList.toggle("on", n > 0);
}

function midnight(d) {
  const x = new Date(d);
  x.setHours(0,0,0,0);
  return x;
}

function fmtDate(str) {
  const d = new Date(str);
  const s = d.toLocaleDateString("fr-FR", {
    weekday:"long",
    day:"numeric",
    month:"long"
  });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function fmtHeure(str) {
  return new Date(str).toLocaleTimeString("fr-FR", {
    hour:"2-digit",
    minute:"2-digit"
  });
}

function getAdresseSansCP(adresse) {
  const str = String(adresse || "");
  return str.replace(/\s+\d{5}\s+.+$/i, "");
}

function getCodePostalVille(adresse) {
  const str = String(adresse || "");
  const match = str.match(/(\d{5})\s+(.+)$/);
  return match ? `${match[1]} ${match[2]}` : "";
}

function escapeJs(value) {
  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");
}

function safe(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

loadData();
</script>
