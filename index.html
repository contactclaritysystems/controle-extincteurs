<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarity Systems</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'DM Sans', sans-serif;
  background:#F2F2F7;
}

.hdr {
  background:#fff;
  padding:16px;
  text-align:center;
}

.logo { height:60px; }

.tabs {
  display:flex;
  background:#fff;
}

.tab {
  flex:1;
  text-align:center;
  padding:12px;
  font-weight:700;
  color:#999;
}

.tab.active { color:#0A84FF; }

#content { padding:14px; }

/* CARDS */
.card {
  background:#fff;
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.cname { font-weight:700; }
.cdate { font-size:13px; color:#666; }

/* DETAIL */
.detail-top {
  background:#fff;
  padding:14px;
  margin:-14px -14px 14px;
}

.back {
  color:#0A84FF;
  font-weight:800;
  margin-bottom:10px;
  cursor:pointer;
}

.main-intervention {
  background:#fff;
  padding:14px;
  border-radius:14px;
  margin-bottom:14px;
}

.action-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.action {
  background:#fff;
  padding:12px;
  border-radius:12px;
  text-align:center;
  font-weight:700;
}

.bottom-actions {
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:14px;
}

.primary-btn {
  background:#0A84FF;
  color:#fff;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:800;
}

.secondary-btn {
  background:#fff;
  color:#0A84FF;
  border:1px solid rgba(10,132,255,0.3);
  padding:14px;
  border-radius:12px;
  font-weight:800;
}

.danger-btn {
  background:#fff;
  color:#FF3B30;
  border:1px solid rgba(255,59,48,0.3);
  padding:14px;
  border-radius:12px;
  font-weight:800;
}

/* POPUP */
.backdrop {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  justify-content:flex-end;
  flex-direction:column;
}

.backdrop.open { display:flex; }

.sheet {
  background:#fff;
  padding:16px;
  border-radius:16px 16px 0 0;
}

.sbtn {
  width:100%;
  padding:14px;
  border:none;
  background:#fff;
  font-weight:700;
}

.sbtn.confirm { color:#0A84FF; }
.sbtn.warn { color:#FF9500; }
.sbtn.danger { color:#FF3B30; }

textarea {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="hdr">
  <img src="https://i.imgur.com/1ZFTLIo.png" class="logo">
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('today')">Aujourd'hui</div>
  <div class="tab" onclick="switchTab('planning')">Planning</div>
</div>

<div id="content"></div>

<div class="backdrop" id="backdrop">
  <div class="sheet">
    <div id="sheetContent"></div>
  </div>
</div>

<script>

/* DATA */
let currentTab = "today";
let selectedItem = null;

/* REPORT */
let reportLines = [];
let tempLine = {};
let step = 1;

/* NAV */
function switchTab(tab){
  currentTab = tab;
  selectedItem = null;
  render();
}

/* RENDER */
function render(){
  const c = document.getElementById("content");
  c.innerHTML = "";

  if(selectedItem){
    renderDetail(selectedItem);
    return;
  }

  const data = [
    {id:1, name:"Client A", date:"Aujourd'hui"},
    {id:2, name:"Client B", date:"Demain"}
  ];

  data.forEach(item=>{
    c.innerHTML += `
      <div class="card" onclick="openDetail(${item.id})">
        <div>
          <div class="cname">${item.name}</div>
          <div class="cdate">${item.date}</div>
        </div>
        <div>›</div>
      </div>
    `;
  });
}

/* DETAIL */
function openDetail(id){
  selectedItem = {id:id, name:"Client "+id};
  render();
}

function renderDetail(item){
  const isPlanning = currentTab === "planning";

  document.getElementById("content").innerHTML = `
    <div class="detail-top">
      <div class="back" onclick="selectedItem=null;render()">‹ Retour</div>
      <strong>Intervention</strong>
    </div>

    <div class="main-intervention">
      ${item.name}
    </div>

    <div class="action-grid">
      <div class="action">📞</div>
      <div class="action">🧭</div>
      <div class="action">👤</div>
      <div class="action">📄</div>
      <div class="action" onclick="openReport()">📋</div>
      <div class="action">💶</div>
    </div>

    <div class="bottom-actions">
      ${!isPlanning ? `<button class="primary-btn" onclick="alert('Clôturé')">Clôturer</button>` : ``}
      <button class="secondary-btn" onclick="openReport()">Reporter</button>
      <button class="danger-btn" onclick="openCancel()">Annuler</button>
    </div>
  `;
}

/* REPORT */
function openReport(){
  renderReport();
}

function renderReport(){
  const c = document.getElementById("content");

  c.innerHTML = `
    <div class="detail-top">
      <div class="back" onclick="render()">‹ Retour</div>
      <strong>Rapport</strong>
    </div>

    ${reportLines.map(l=>`
      <div class="card">
        <div>
          <div class="cname">${l.equipement} - ${l.action}</div>
          <div class="cdate">${l.resultat}</div>
          ${l.commentaire ? `<div class="cdate">${l.commentaire}</div>` : ""}
        </div>
      </div>
    `).join("")}

    <button class="secondary-btn" onclick="startLine()">+ Ajouter une tâche</button>

    <div class="bottom-actions">
      <button class="primary-btn" onclick="validateReport()">Clôturer rapport</button>
    </div>
  `;
}

function startLine(){
  tempLine = {};
  step = 1;
  renderStep();
}

function renderStep(){
  const c = document.getElementById("content");

  if(step===1){
    c.innerHTML = stepTemplate("Équipement",["Extincteur","BAES","Alarme"],"equipement");
  }
  if(step===2){
    c.innerHTML = stepTemplate("Action",["Vérification","Maintenance","Remplacement"],"action");
  }
  if(step===3){
    c.innerHTML = stepTemplate("Résultat",["Conforme","Non conforme","À remplacer"],"resultat");
  }
  if(step===4){
    c.innerHTML = `
      <div class="detail-top">
        <div class="back" onclick="step=3;renderStep()">‹ Retour</div>
        <strong>Commentaire</strong>
      </div>

      <textarea id="comment"></textarea>

      <button class="primary-btn" onclick="saveLine()">Ajouter</button>
    `;
  }
}

function stepTemplate(title, options, key){
  return `
    <div class="detail-top">
      <div class="back" onclick="step--;renderStep()">‹ Retour</div>
      <strong>${title}</strong>
    </div>

    <div class="action-grid">
      ${options.map(o=>`<div class="action" onclick="select('${key}','${o}')">${o}</div>`).join("")}
    </div>
  `;
}

function select(key,value){
  tempLine[key]=value;
  step++;
  renderStep();
}

function saveLine(){
  tempLine.commentaire=document.getElementById("comment").value;
  reportLines.push(tempLine);
  renderReport();
}

function validateReport(){
  if(reportLines.length===0){
    alert("Ajoute une tâche");
    return;
  }
  alert("Rapport validé");
  render();
}

/* POPUP */
function openCancel(){
  document.getElementById("sheetContent").innerHTML = `
    <button class="sbtn warn">Annuler + reprogrammer</button>
    <button class="sbtn danger">Annuler définitivement</button>
  `;
  document.getElementById("backdrop").classList.add("open");
}

/* INIT */
render();

</script>

</body>
</html>
